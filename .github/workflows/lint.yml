name: Lint

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-config-ansible.yaml') }}

      - name: Run pre-commit (main config)
        run: pre-commit run --all-files --show-diff-on-failure

      # ansible-lint is not in the main config on purpose, see
      # docs/decisions/0003-ansible-lint-in-ci-and-separate-config.md.
      # `!cancelled()` runs it even if the step above failed, so one push
      # reports every problem instead of one per round trip.
      - name: Run ansible-lint (separate pre-commit config)
        if: ${{ !cancelled() }}
        run: pre-commit run --all-files --show-diff-on-failure -c .pre-commit-config-ansible.yaml
