# Sqitch project configuration. No credentials here: the host, port, user and
# password come from the environment (PGHOST, PGPORT, PGUSER, PGPASSWORD; see
# the sqitch service in docker-compose/docker-compose.yml and ADR 0004).
[core]
	engine = pg

# Migrations connect to the session-mode PgBouncer alias, not to the normal
# transaction-mode database: Sqitch relies on session state. See ADR 0004.
[engine "pg"]
	target = db:pg:postgres_pitch_migrations
