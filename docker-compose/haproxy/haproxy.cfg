# HAProxy config for postgres-pitch.
#
# Connection flow: client -> HAProxy (this file, routing) -> PgBouncer
# (pooling) -> PostgreSQL. HAProxy decides *which physical node* a
# connection goes to, based on Patroni's REST API; PgBouncer, sitting
# behind it, pools connections to whichever node HAProxy routed to.
#
# Two frontends:
#   - :5000 (write)      -> only the current primary
#   - :5001 (read-only)  -> load-balanced across healthy replicas
#
# Health checks hit each node's Patroni REST API (port 8008) — NOT the
# PgBouncer/PostgreSQL port itself — via the `addr`/`port` overrides on
# each `server` line below, while actual data traffic still goes to that
# node's colocated PgBouncer instance. Patroni's REST API returns:
#   GET /primary -> 200 only on the current leader, 503 otherwise
#   GET /replica -> 200 only on a healthy streaming replica, 503 otherwise
# https://patroni.readthedocs.io/en/latest/rest_api.html

global
    log stdout format raw local0
    maxconn 200

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    # retries/redispatch: if a connection attempt lands on a node that
    # just stopped being primary (health check hasn't caught up yet),
    # retry against a different server rather than failing the client
    # connection outright.
    retries 2
    option  redispatch

# Docker's embedded DNS. Without this, HAProxy resolves server hostnames
# only ONCE at startup — but a container's IP can change when it is
# recreated (docker kill/start in tests/failover_test.sh does exactly
# that), leaving HAProxy pointing at a stale address. With a resolvers
# section, names are re-resolved at runtime; init-addr libc,none also
# lets HAProxy start even if a name doesn't resolve yet, instead of
# refusing to boot.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

# --- Health-check backends (no client traffic ever goes here) -----------
# Health is checked against each node's own Patroni REST API (port 8008),
# with the node's own hostname as the server address — so the name is
# re-resolved dynamically via the resolvers section above. The traffic
# backends further down don't run checks themselves; they `track` the
# state of these servers instead. (The alternative — one server line with
# a separate check `addr` — would resolve that hostname only once at
# parse time, so a recreated container's new IP would leave the health
# check pointing at a stale address.)
#
# Patroni's REST API returns:
#   GET /primary -> 200 only on the current leader, 503 otherwise
#   GET /replica -> 200 only on a healthy streaming replica, 503 otherwise
#
# Check interval is intentionally faster than Patroni's own failure
# detection (dcs.ttl: 30s / dcs.loop_wait: 10s in patroni.yml) so HAProxy
# doesn't add meaningfully more delay on top of the ~28s Patroni itself
# takes to detect a failed primary and promote a new one (measured via
# tests/failover_test.sh). fall 3 / rise 2 avoids flapping on a single
# missed check.
backend health_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 resolvers docker init-addr libc,none
    server pg0 postgresql0:5432 check port 8008
    server pg1 postgresql1:5432 check port 8008
    server pg2 postgresql2:5432 check port 8008

backend health_replica
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 resolvers docker init-addr libc,none
    server pg0 postgresql0:5432 check port 8008
    server pg1 postgresql1:5432 check port 8008
    server pg2 postgresql2:5432 check port 8008

# --- Client-facing endpoints ---------------------------------------------
frontend pg_write
    bind *:5000
    default_backend pg_write_backend

# on-marked-down shutdown-sessions: when a node stops being primary, also
# drop sessions already open through it — by default HAProxy only stops
# sending NEW connections, and a demoted primary would keep serving
# stale write sessions.
backend pg_write_backend
    default-server on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pgb0 pgbouncer0:6432 track health_primary/pg0
    server pgb1 pgbouncer1:6432 track health_primary/pg1
    server pgb2 pgbouncer2:6432 track health_primary/pg2

frontend pg_read
    bind *:5001
    default_backend pg_read_backend

backend pg_read_backend
    balance roundrobin
    default-server resolvers docker init-addr libc,none
    server pgb0 pgbouncer0:6432 track health_replica/pg0
    server pgb1 pgbouncer1:6432 track health_replica/pg1
    server pgb2 pgbouncer2:6432 track health_replica/pg2

# Stats page for visibility while developing/debugging — not exposed to
# the host by default beyond the mapped port in docker-compose.yml.
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
