# PgBouncer config for the instance colocated with postgresql0.
# No secrets here — auth_user's password is generated into userlist.txt
# at container start from PGBOUNCER_AUTH_USER/PASSWORD env vars (see
# docker-compose.yml), never committed.
#
# auth_query avoids needing a static userlist.txt entry for every
# application role (analytics_readonly, etl_writer, ...): PgBouncer looks
# up any role's password hash on demand via the user_lookup() function
# created in post_bootstrap.sh. See:
# https://www.pgbouncer.org/config.html#auth_query

[databases]
postgres_pitch = host=postgresql0 port=5432 dbname=postgres_pitch

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_user = pgbouncer_auth
auth_query = SELECT * FROM public.user_lookup($1)
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
admin_users = pgbouncer_auth

# Backend recovery. When a server login fails (e.g. "the database system is
# starting up" while a demoted primary restarts as a replica after a
# switchover), PgBouncer caches the error and rejects ALL new logins to that
# backend for this many seconds (default 15) - even after the node is ready.
# HAProxy only sees Patroni's health, not PgBouncer's cache, so keep it short.
server_login_retry = 1
